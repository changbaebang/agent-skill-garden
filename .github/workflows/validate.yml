name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validator dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate repository
        run: ./scripts/validate.sh
      - name: Save context footprint
        run: python3 scripts/context_report.py --json > context-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: context-footprint
          path: context-report.json
      - name: Smoke-test both project adapters
        run: |
          expected_skill_count="$(find core/skills -mindepth 1 -maxdepth 1 -type d | wc -l)"
          mkdir -p work/smoke-project
          ./scripts/install.sh --target all --scope project --root work/smoke-project --apply
          test "$(find work/smoke-project/.claude/skills -type l | wc -l)" -eq "$expected_skill_count"
          test "$(find work/smoke-project/.agents/skills -type l | wc -l)" -eq "$expected_skill_count"
          mkdir -p work/cursor-project
          ./scripts/install.sh --target cursor --scope project --root work/cursor-project --apply
          test "$(find work/cursor-project/.agents/skills -type l | wc -l)" -eq "$expected_skill_count"
          test ! -e work/cursor-project/.cursor/skills
          mkdir -p work/small-project
          ./scripts/install.sh --target codex --scope project --root work/small-project \
            --skill intake --skill critical-review --apply
          test "$(find work/small-project/.agents/skills -type l | wc -l)" -eq 2
