[profile]
schema_version = 1
name = personal
visibility = local

[integration.blog]
enabled = false
driver = jekyll-git
repository = ~/Sites/example-blog
drafts = ~/Documents/example-blog-drafts
content_root = _posts
branch = main
base_url = https://example.github.io
verify = page,sitemap,home

[integration.slack]
enabled = false
driver = slack-host-connector
workspace = example-workspace
channel_reviews = frontend-reviews
